# starts the Excavator of AlphaJack/scoop-bucket, which updates bucket/mercurio.json to the latest release.
# Secrets:
#   SCOOP_BUCKET_TOKEN  fine-grained PAT with Actions read and write on AlphaJack/scoop-bucket.
name: Scoop

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions: {}

jobs:
  scoop:
    name: Update Scoop bucket
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start Excavator
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: gh workflow run excavator.yml -R AlphaJack/scoop-bucket
