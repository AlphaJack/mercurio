# Release flow:
#   1. Every push to main that passes CI updates a "release" PR (version bump + changelog). 2. Once that PR is merged and CI passes on it, release-plz publishes mercurio, then mercurio-cli, to crates.io and pushes the `vX.Y.Z` tag. 3. The tag starts release.yml (dist): binaries, installers, GitHub  Release, then the ghcr.io image.
#
# Secrets:
#   RELEASE_PLZ_TOKEN     fine-grained PAT (contents + pull-requests: write). CARGO_REGISTRY_TOKEN  crates.io token with publish rights for both crates.
name: Release-plz

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    name: Publish crates and tag
    if: >-
      ${{ !github.event.repository.fork
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check that main is still the commit CI tested
        id: tested
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: echo "current=$([ "$(git rev-parse HEAD)" = "$TESTED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        if: steps.tested.outputs.current == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Publish crates and push tag
        if: steps.tested.outputs.current == 'true'
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Open or update the release PR
    if: >-
      ${{ !github.event.repository.fork
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check that main is still the commit CI tested
        id: tested
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: echo "current=$([ "$(git rev-parse HEAD)" = "$TESTED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        if: steps.tested.outputs.current == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Open or update release PR
        if: steps.tested.outputs.current == 'true'
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
