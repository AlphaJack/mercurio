allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
too-many-lines-threshold = 80
disallowed-methods = [
  { path = "std::thread::sleep", reason = "use Transport::sleep so tests stay fast" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "nondeterministic order breaks byte-exact fixtures; use BTreeMap or Vec" },
]
