[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
checksum = "sha256"
# release-plz drafts the release with the changelog; dist uploads to it and publishes it.
create-release = false
# The systemd unit and its settings ship next to the binary (manual installs and the AUR package use them).
include = ["packaging/systemd/mercurio.service", "packaging/systemd/mercurio.env"]
# steps injected into every build-local-artifacts job (sccache etc.)
github-build-setup = "../build-setup.yml"
post-announce-jobs = ["./docker", "./aur"]
github-custom-job-permissions = { "docker" = { contents = "read", packages = "write" }, "aur" = { contents = "read" } }

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
armv7-unknown-linux-musleabihf = "ubuntu-24.04"
aarch64-apple-darwin = "macos-14"
x86_64-pc-windows-msvc = "windows-2022"
aarch64-pc-windows-msvc = "windows-11-arm"
