# Cargo deny check: run by CI (`deny` job).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails, including unmaintained crates.
unmaintained = "all"
ignore = [
  # Marvin: rsa's private-key operations leak timing. rpgp (service-email-pgp,
  # service-deltachat-pgp) depends on rsa, but mercurio refuses RSA private keys
  # and only signs with Ed25519; RSA public-key encryption is not affected.
  { id = "RUSTSEC-2023-0071", reason = "RSA private keys are never used: PGP signs with Ed25519 only" },
]

[licenses]
# Permissive licenses compatible with Apache-2.0.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
