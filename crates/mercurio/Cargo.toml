[package]
name = "mercurio"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["notifications", "push", "webhook", "alerts"]
categories = ["network-programming", "web-programming::http-client"]
build = "build.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
base64 = "0.23"
emojis = { version = "0.9", default-features = false }
log = "0.4"
pollster = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
async-lock = "3"
tokio = { version = "1.54", optional = true, default-features = false, features = ["net", "time", "fs", "process", "io-util"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider"] }
saphyr-parser = "0.2"
html-escape = "0.3.0"
quick-xml = "0.42"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["aes", "alloc"] }
blake2 = { version = "0.11", optional = true, default-features = false }
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", optional = true, default-features = false, features = ["alloc"] }
aes = { version = "0.9", optional = true }
md-5 = "0.11"
salsa20 = { version = "0.11", optional = true, default-features = false }
poly1305 = { version = "0.9", optional = true }
curve25519-dalek = { version = "5", optional = true, default-features = false }
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
# The integration tests use the fixture runner (`testing` feature).
mercurio = { path = ".", default-features = false, features = ["testing", "transport-blocking"] }
insta = { version = "1.49.0", features = ["yaml"] }
tokio = { version = "1.54", features = ["rt", "macros", "net", "io-util", "time"] }

[features]
# Every service and the async API on tokio.
default = ["all-services", "transport-tokio"]
# Every `service-*` feature.
all-services = [
