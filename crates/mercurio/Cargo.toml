# Tokio transport: `TokioTransport` and `AsyncMercurio::new` (tokio + reqwest).
transport-tokio = ["dep:tokio", "dep:tokio-rustls", "dep:reqwest"]
# Blocking transport: `BlockingTransport` and `Mercurio::new` (ureq).
transport-blocking = ["dep:ureq"]

# Compile the fixture runner (`testing::fixtures`); `testing::FakeTransport` is always available.
testing = []

