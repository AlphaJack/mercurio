[package]
name = "mercurio"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["notifications", "push", "webhook", "alerts"]
categories = ["network-programming", "web-programming::http-client"]
build = "build.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
base64 = "0.23"
log = "0.4"
saphyr-parser = "0.2"
html-escape = "0.3.0"
quick-xml = "0.42"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["aes", "alloc"] }
blake2 = { version = "0.11", optional = true, default-features = false }
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", optional = true, default-features = false, features = ["alloc"] }
aes = { version = "0.9", optional = true }
md-5 = "0.11"
salsa20 = { version = "0.11", optional = true, default-features = false }
poly1305 = { version = "0.9", optional = true }
curve25519-dalek = { version = "5", optional = true, default-features = false }
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
# The integration tests use the fixture runner (`testing` feature).
mercurio = { path = ".", default-features = false, features = ["testing"] }
insta = { version = "1.49.0", features = ["yaml"] }

[features]
# Every service. `default-features = false` drops the `extra` services and the crates they pull in.
default = ["extra"]
# Services that need extra cryptography crates (listed below), and Matrix end-to-end encryption.
extra = [
  "dep:aes",
  "dep:aes-gcm",
  "dep:argon2",
  "dep:blake2",
  "dep:chacha20poly1305",
  "dep:curve25519-dalek",
  "dep:poly1305",
  "dep:salsa20",
  "dep:zeroize",
]
# Compile the fixture runner (`testing::fixtures`); `testing::FakeTransport` is always available.
testing = []

# The services each feature gates. This list is read by build.rs and the book generator.
[package.metadata.mercurio.feature-services]
extra = ["bark", "emby", "jellyfin", "pushover", "simplepush", "sogs"]
