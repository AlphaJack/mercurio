[package]
name = "mercurio-cli"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["apprise", "notifications", "cli", "push", "alerts"]
categories = ["command-line-utilities", "network-programming"]

[lints]
workspace = true

[[bin]]
name = "mercurio"
path = "src/main.rs"

[features]
default = ["all-services", "bundle-timezones"]
all-services = ["mercurio/all-services"]
bundle-timezones = ["mercurio/bundle-timezones"]

[dependencies]
mercurio = { workspace = true, features = ["transport-tokio"] }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "fs", "net", "signal", "macros", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "matched-path"] }
tower = { version = "0.5", default-features = false, features = ["util", "limit", "load-shed"] }
tower-http = { version = "0.7", default-features = false, features = ["timeout", "catch-panic", "normalize-path"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "tracing-log", "json"] }
serde_json = "1"
ring = "0.17"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
